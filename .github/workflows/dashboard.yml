name: Dashboard

# Rebuilds the README's dashboard (dashboard/render.jsx) from the GitHub API and
# a request to each project's demo, then publishes the two SVGs to the `output`
# branch, so main never collects a commit per rebuild.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [dashboard/**, .github/workflows/dashboard.yml]

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
        working-directory: dashboard

      - run: npm run build
        working-directory: dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Rebuild dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
